---
layout: page
title: Projects
lead: Boards, firmware and hardware I've built, newest first.
---
<div class="cards">
  {% assign projects = site.projects | sort: "order" %}
  {% for p in projects %}
  <a class="card" href="{{ p.url | relative_url }}">
    <span class="when mono">{{ p.period }}</span>
    <h3>{{ p.title }}</h3>
    <p>{{ p.summary }}</p>
    <span class="tags">{% for t in p.tags %}<span class="tag">{{ t }}</span>{% endfor %}</span>
  </a>
  {% endfor %}
</div>

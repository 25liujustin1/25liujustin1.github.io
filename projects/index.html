---
layout: page
title: Projects
---
<div class="cards">
  {% assign projects = site.projects | sort: "date" | reverse %}
  {% for p in projects %}
  <a class="card" href="{{ p.url | relative_url }}">
    <span class="when mono">{{ p.period }}{% if p.context %} · {{ p.context }}{% endif %}</span>
    <h3>{{ p.title }}</h3>
    <p>{{ p.summary }}</p>
    <span class="tags">{% for t in p.tags %}<span class="tag">{{ t }}</span>{% endfor %}</span>
  </a>
  {% endfor %}
</div>

title: Justin Ren Liu
part_number: JRL-2029
tagline: Electrical Engineer for PCB Design, Power Systems and Embedded Firmware
description: >-
  Justin Ren Liu is a UCLA Electrical Engineering student working on PCB design,
  power systems and bare-metal firmware for rockets, underwater robots and lab hardware.
author: Justin Ren Liu
email: liujustin1@g.ucla.edu
github: 25liujustin1
location: Los Angeles, CA

# Board renders shown on the site. Each is a file in _includes/boards/.
# Swap the hand-drawn decoder for the KiCad render once it exists
# (python tools/kicad_to_svg.py ... _includes/boards/decoder.svg).
boards:
  home: decoder-hand.svg
  card:            # e.g. card.svg, rendered from the business card's KiCad file
show_card_link: true   # small "got my card?" link on the home page

url: https://25liujustin1.github.io
baseurl: ""

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: /blog/:year/:month/:title/

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope: { path: "", type: projects }
    values: { layout: post }
  - scope: { path: "", type: posts }
    values: { layout: post }

plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - tools
  - mockups
